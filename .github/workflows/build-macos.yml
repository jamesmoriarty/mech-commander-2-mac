name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest # arm64 (Apple Silicon) runner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: make deps

      - name: Import Developer ID certificate
        # No-ops (leaves ad-hoc signing) unless the cert secrets are set.
        env:
          P12_B64: ${{ secrets.MC2_SIGN_P12_BASE64 }}
          P12_PWD: ${{ secrets.MC2_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${P12_B64:-}" ]]; then
            echo "No signing cert secret; build will be ad-hoc signed."
            exit 0
          fi
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dev_id.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/dev_id.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$P12_PWD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k ci "$RUNNER_TEMP/build.keychain"
          rm "$RUNNER_TEMP/dev_id.p12"
          security find-identity -v -p codesigning | grep 'Developer ID Application'

      - name: Build engine and process game data
        run: make native

      - name: Build app bundle and zip
        # SKIP_DATA_ARCHIVE path: mc2-data.tar.gz holds Microsoft game assets
        # and must never be uploaded to artifacts or releases.
        env:
          MC2_NOTARY_API_KEY_B64: ${{ secrets.MC2_NOTARY_API_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${MC2_NOTARY_API_KEY_B64:-}" ]]; then
            echo "$MC2_NOTARY_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            export MC2_NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
            export MC2_NOTARY_KEY_ID="${{ secrets.MC2_NOTARY_KEY_ID }}"
            export MC2_NOTARY_ISSUER_ID="${{ secrets.MC2_NOTARY_ISSUER_ID }}"
          fi
          SKIP_DATA_ARCHIVE=1 ./scripts/build-dist-macos.sh

      - name: Verify bundle signature
        run: |
          codesign --verify --strict --deep dist/MechCommander2.app
          spctl -a -vv -t exec dist/MechCommander2.app 2>&1 || true

      - name: Upload engine package
        uses: actions/upload-artifact@v4
        with:
          name: MechCommander2-mac
          path: dist/MechCommander2-mac.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        # Attaches only the engine zip; game data is never included.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MechCommander2-mac.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Native arm64 MechCommander 2 engine port (MechCommander2.app).

            No game data included - the launcher downloads it on first run.
            Unsigned/ad-hoc: if macOS blocks it, run
            `xattr -dr com.apple.quarantine MechCommander2.app`.
